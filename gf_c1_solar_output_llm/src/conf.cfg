[solar_extraction]

# Global Solar Atlas GeoTIFF directory + PVOUT raster within it
tif_dir = Australia_GISdata_LTAy_AvgDailyTotals_GlobalSolarAtlas-v2_GEOTIFF
tif_path = ../data/%(tif_dir)s/PVOUT.tif

coords_cache_path = ../data/city_coords.csv
output_path = ../output/city_solar_output.csv

# CRSes used to build a metric-accurate buffer polygon around each city
metric_crs = EPSG:3577
wgs84_crs = EPSG:4326

# 15 km — documented assumption, adjust/justify as needed
buffer_radius_m = 15000

# Full city/station name list from the weather CSV
city_names = Adelaide,Albany,Albury,Alice Springs,Badgerys Creek,Ballarat,Bendigo,Brisbane,Cairns,Canberra,Cobar,Coffs Harbour,Dartmoor,Darwin,Gold Coast,Hobart,Katherine,Launceston,Melbourne,Melbourne Airport,Mildura,Moree,Mount Gambier,Mount Ginini,Newcastle,Nhil,Norah Head,Norfolk Island,Nuriootpa,Pearce RAAF,Penrith,Perth,Perth Airport,Portland,Richmond,Sale,Salmon Gums,Sydney,Sydney Airport,Townsville,Tuggeranong,Uluru,Wagga Wagga,Walpole,Watsonia,Williamtown,Witchcliffe,Wollongong,Woomera


[weather_prep]

# Kaggle Australia weather dataset
weather_csv_path = ../data/Weather Training Data.csv

# output from solar_extraction.py
solar_csv_path = ../output/city_solar_output.csv

# column holding the city/station name
city_column = Location


# Weather feature columns to aggregate. Adjust to match what's actually in
# your CSV — check df.columns.tolist() first, since column names can differ
# slightly between Kaggle repackagings of the same underlying BOM data.
weather_feature_columns = MinTemp,MaxTemp,Rainfall,Evaporation,Sunshine,WindGustSpeed,Humidity9am,Humidity3pm,Pressure9am,Pressure3pm,Cloud9am,Cloud3pm,Temp9am,Temp3pm

# Subset of weather_feature_columns used to decide which cities have zero
# coverage and should be dropped (see drop_zero_coverage_locations()) —
# kept intentionally narrower than weather_feature_columns so a sparse,
# non-essential column doesn't cause an otherwise-usable city to be dropped.
select_feature_columns = Sunshine,Cloud9am,Cloud3pm,MaxTemp,Rainfall,Humidity3pm

aggregated_output_path = ../output/modeling_data_aggregated.csv


[model_training]

modeling_data_path = ../output/modeling_data_aggregated.csv
city_column = Location
target_column = solar_output

# Narrow, domain-informed feature set — see model_training.py's module
# docstring for why this isn't all mean/min/max columns.
features = Sunshine_mean,Cloud9am_mean,Cloud3pm_mean,MaxTemp_mean,Rainfall_mean,Humidity3pm_mean

ridge_alpha = 1.0

model_output_path = ../output/solar_model.joblib
feature_ranges_path = ../output/feature_ranges.json
city_features_output_path = ../output/city_features_lookup.csv


[agent]

model_path = ../output/solar_model.joblib
feature_ranges_path = ../output/feature_ranges.json
city_features_path = ../output/city_features_lookup.csv
city_column = Location

# Raw (daily-granularity) weather records -- used only for descriptive_stats.
weather_raw_path = ../data/Weather Training Data.csv

valid_stats = mean,median,std,min,max,p10,p25,p75,p90,percent_above,percent_below

# Weather feature names the intent parser is allowed to extract for
# weather_conditioned_output queries (raw CSV column names, not the
# model's aggregated "_mean" feature names).
known_weather_features = MinTemp,MaxTemp,Rainfall,Evaporation,Sunshine,WindGustSpeed,WindSpeed9am,WindSpeed3pm,Humidity9am,Humidity3pm,Pressure9am,Pressure3pm,Cloud9am,Cloud3pm,Temp9am,Temp3pm

# Point this at your local model server. Ollama example:
#   ollama pull llama3.1
#   ollama serve
llm_base_url = http://localhost:11434/v1
llm_model_name = llama3.1:8b
llm_api_key = not-needed-for-local

hectare_to_m2 = 10000


[model_comparison]

random_state = 42


[eval_harness]

eval_results_output_path = ../output/eval_results.csv
